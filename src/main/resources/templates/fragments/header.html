<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(pagina)" class="top">
  <div class="wrap">
    <a class="logo" th:href="@{/}">
      <svg viewBox="0 0 26 26" aria-hidden="true">
        <rect x="3" y="2" width="9" height="9" fill="#F4D35E" stroke="#1E3A34" stroke-width="2"/>
        <rect x="14" y="2" width="9" height="9" fill="none" stroke="#1E3A34" stroke-width="2"/>
        <rect x="8" y="14" width="10" height="10" fill="#F4D35E" stroke="#1E3A34" stroke-width="2"/>
      </svg>
      Mundo MakerKids
    </a>
    <nav aria-label="Principal">
      <a th:href="@{/atividades}"
         th:attr="aria-current=${pagina == 'atividades'} ? 'page' : null">Atividades</a>
      <a th:href="@{/sobre}"
         th:attr="aria-current=${pagina == 'sobre'} ? 'page' : null">Sobre o projeto</a>
    </nav>
  </div>
</header>
</body>
</html>
