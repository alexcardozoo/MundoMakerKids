spring.application.name=MundoKids
server.port=9000

# Base de Dados H2 em Memoria
spring.datasource.url=jdbc:h2:mem:mundokidsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=2613
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Forca a recriacao limpa da tabela com as novas colunas
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Configuracao do Thymeleaf
spring.thymeleaf.cache=false
spring.devtools.restart.enabled=true